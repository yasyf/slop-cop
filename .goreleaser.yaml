version: 2

project_name: slop-cop

before:
  hooks:
    - go mod download

# slop-cop links tree-sitter (cgo), so every target must build with
# CGO_ENABLED=1 and a C toolchain. linux cross-compiles via `zig cc`
# (zig bundles a full cross C toolchain: static musl Linux);
# darwin builds natively on the macOS runner with clang because zig does not
# ship the macOS SDK. FreeBSD is intentionally absent (go-tree-sitter has no
# freebsd support).
builds:
  - id: slop-cop
    main: ./cmd/slop-cop
    binary: slop-cop
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }}
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - "CC=zig cc -target x86_64-linux-musl"
          - "CXX=zig c++ -target x86_64-linux-musl"
      - goos: linux
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - "CC=zig cc -target aarch64-linux-musl"
          - "CXX=zig c++ -target aarch64-linux-musl"
      # darwin amd64/arm64 fall through to the build-level env (CGO_ENABLED=1,
      # native clang) with no CC override.
    # Developer ID sign + notarize the darwin binaries via codesign + notarytool
    # (quill SIGKILLs on arm64 — anchore/quill#566), using the shared script the
    # import-developer-id action drops on the runner ($MACOS_CODESIGN_SCRIPT).
    # Local release configuration validation uses `goreleaser check`.
    hooks:
      post:
        - cmd: bash "{{ .Env.MACOS_CODESIGN_SCRIPT }}" "{{ .Path }}" "{{ .Target }}"
          output: true

archives:
  # Versioned tar.gz — the shape the binrun descriptor's render-descriptor.sh
  # expects (<bin>_<version>_<os>_<arch>.tar.gz); goreleaser rewrites the cask
  # URL to match, so the cask keeps consuming these.
  - id: slop-cop
    ids: [slop-cop]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  # Bare per-arch binaries for install-binary.sh (version-less, resolved without
  # a pinned version). Both archives land in checksums.txt.
  - id: binary
    ids: [slop-cop]
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: slop-cop
    # Pin the cask to the tar.gz archives it has always consumed; without
    # this, the bare-binary archive above makes the cask pipe ambiguous.
    ids: [slop-cop]
    binaries:
      - slop-cop
    repository:
      owner: yasyf
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/yasyf/slop-cop
    description: Detect the rhetorical and structural tells of LLM-generated prose and emit a structured JSON report.

release:
  prerelease: auto
  # Lets the shared workflow's goreleaser retry re-upload after a mid-publish failure.
  replace_existing_artifacts: true

changelog:
  use: github
  sort: asc
