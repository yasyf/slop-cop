name: Release

# Every push to main auto-releases: release-go.yml tags v0.1.<run_number>, then
# goreleaser builds (cgo tree-sitter; zig cross-compiles linux), codesigns the
# darwin binaries, and publishes the cask. github.run_number stays monotonic as long as
# this workflow file keeps its path (.github/workflows/release.yml).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true
      - name: go test
        run: go test -race ./...

  release:
    needs: test
    uses: yasyf/homebrew-tap/.github/workflows/release-go.yml@52b26a1684d94ae2669d124f844148deaa4f5baf
    secrets: inherit
    with:
      runner: macos-latest
      signer: codesign
      setup-zig: "0.16.0"
      auto-tag: true
