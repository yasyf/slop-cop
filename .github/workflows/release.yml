name: Release

# A signed v* tag builds the cgo tree-sitter binaries, cross-compiles Linux
# with zig, codesigns Darwin binaries, and publishes the cask.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true
      - name: go test
        run: go test -race ./...

  release:
    needs: test
    uses: yasyf/homebrew-tap/.github/workflows/release-go.yml@41f8de6765b3b833ef333b0b98f5683f0e46685b
    secrets: inherit
    with:
      runner: macos-latest
      signer: codesign
      setup-zig: "0.16.0"

  # Refresh this repo's binrun descriptor + plugin.json in lockstep with the
  # release tag (the marketplace serves main HEAD): descriptor and manifest
  # move together, in one [skip ci] commit, gated on the two agreeing before
  # push — the uniformity requirement that keeps the CI agreement gate green
  # after every release. The canonical cc-skills marketplace copy refreshes
  # itself: HOMEBREW_TAP_TOKEN cannot push to cc-skills, so cc-skills runs a
  # pull-based slop-cop-descriptor.yml (daily + dispatch) with its own token.
  # The signed trigger tag is the release identity.
  descriptor:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out slop-cop (main)
        uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "${GITHUB_REPOSITORY}" \
            --dir dist --pattern '*.tar.gz' --pattern 'checksums.txt'
      - name: Render descriptor + lockstep plugin.json
        run: |
          version="${TAG#v}"
          sh scripts/render-descriptor.sh dist "$version" > bin/slop-cop.binrun
          chmod +x bin/slop-cop.binrun
          tmp="$(mktemp)"
          jq --arg v "$version" '.version = $v' .claude-plugin/plugin.json > "$tmp" \
            && mv "$tmp" .claude-plugin/plugin.json
      - name: Agreement gate (plugin.json version == descriptor version.static)
        run: |
          test "$(jq -r .version .claude-plugin/plugin.json)" \
             = "$(tail -n +2 bin/slop-cop.binrun | jq -r .version.static)"
      - name: Validate descriptor
        run: |
          cd "$RUNNER_TEMP"
          go run github.com/yasyf/binrun/cmd/binrun@v0.1.1 -- parse \
            "$GITHUB_WORKSPACE/bin/slop-cop.binrun"
      - name: Commit descriptor + plugin.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/slop-cop.binrun .claude-plugin/plugin.json
          if git diff --cached --quiet; then
            echo "descriptor + plugin.json already at ${TAG#v}"
            exit 0
          fi
          git commit -m "chore: sync slop-cop.binrun + plugin.json to ${TAG#v} [skip ci]"
          for _ in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
          done
          echo "::error::could not push descriptor + plugin.json to main after 3 attempts"
          exit 1
      - name: Upload descriptor to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" bin/slop-cop.binrun \
            --repo "${GITHUB_REPOSITORY}" --clobber

  # Keep the Cursor manifest's version in lockstep with the binary tag. The
  # commit carries [skip ci] so it never re-triggers this release (a loop).
  cursor-bump:
    needs: descriptor
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Bump .cursor-plugin/plugin.json to the release version
        id: commit
        run: |
          version="${TAG#v}"
          plugin=.cursor-plugin/plugin.json
          tmp="$(mktemp)"
          jq --arg v "$version" '.version = $v' "$plugin" > "$tmp" && mv "$tmp" "$plugin"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$plugin"
          if ! git diff --cached --quiet; then
            git commit -m "chore(cursor): bump plugin version to ${version} [skip ci]"
            pushed=false
            for _ in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                pushed=true
                break
              fi
            done
            if [ "$pushed" != true ]; then
              echo "::error::could not push cursor version bump after 3 attempts"
              exit 1
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Dispatch and wait for post-release checks
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pids=()
          for workflow in ci.yml guides.yml; do
            response="$(
              jq -n --arg commit "$COMMIT" '{ref: "main", inputs: {commit: $commit}}' |
                gh api --method POST \
                  -H "X-GitHub-Api-Version: 2026-03-10" \
                  "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
                  --input -
            )"
            run_id="$(jq -er '.workflow_run_id' <<<"$response")"
            gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"
