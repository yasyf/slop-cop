name: Release

# Every push to main auto-releases: release-go.yml@v1 tags v0.1.<run_number>, then
# goreleaser builds (cgo tree-sitter; zig cross-compiles linux), codesigns the
# darwin binaries, and publishes the cask. github.run_number stays monotonic as long as
# this workflow file keeps its path (.github/workflows/release.yml).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: yasyf/homebrew-tap/.github/workflows/release-go.yml@v1
    secrets: inherit
    with:
      runner: macos-latest
      signer: codesign
      setup-zig: "0.16.0"
      auto-tag: true
